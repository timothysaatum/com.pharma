name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend.laso
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend.laso/requirements.txt
      - name: Install backend dependencies
        run: pip install --requirement requirements.txt
      - name: Run backend tests
        run: python -m pytest -q
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui.laso
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        run: pnpm audit --prod
      - name: Run frontend tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install native cr-sqlite extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.16.3 --repo vlcn-io/cr-sqlite --pattern "crsqlite-linux-x86_64.zip" --dir ui.laso/src-tauri/crsqlite-download
          node ui.laso/scripts/install-crsqlite-extension.mjs ui.laso/src-tauri/crsqlite-download/crsqlite-linux-x86_64.zip ui.laso/src-tauri/crsqlite.so
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test Rust commands
        working-directory: ui.laso/src-tauri
        run: cargo test --locked
      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ui.laso/src-tauri/Cargo.toml
          command: check
          command-arguments: advisories
