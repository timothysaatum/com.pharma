name: Build and Release Tauri App

on:
  push:
    tags:
      - 'v*'   # Triggers when you push a version tag e.g. v1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (for example v1.2.8)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag and application version
        working-directory: ui.laso
        run: node scripts/check-version.mjs "$RELEASE_TAG"

  build:
    needs: validate-version
    name: build (${{ matrix.name }})
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.atlas.drive4health.org' }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            args: ''
          - name: Windows x64
            platform: windows-latest
            args: ''
          - name: macOS Apple Silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin'  # Apple Silicon
          - name: macOS Intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin'   # Intel Mac

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update -m || sudo apt-get update || true
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        timeout-minutes: 10

      - name: Install frontend dependencies
        working-directory: ui.laso
        run: pnpm install --frozen-lockfile

      - name: Validate production API URL
        run: node -e "if (!process.env.VITE_API_URL?.startsWith('https://')) throw new Error('VITE_API_URL must be an HTTPS URL')"

      - name: Test frontend
        working-directory: ui.laso
        run: pnpm test

      - name: Audit frontend dependencies
        working-directory: ui.laso
        run: pnpm audit --prod --ignore-registry-errors

      - name: Test Rust commands
        working-directory: ui.laso/src-tauri
        run: cargo test --locked --lib

      - name: Audit Rust dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ui.laso/src-tauri/Cargo.toml
          command: check
          command-arguments: advisories

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: ui.laso
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Laso v__VERSION__'
          generateReleaseNotes: true
          releaseDraft: true   # Creates a draft release — you review before publishing
          prerelease: false
          args: ${{ matrix.args }}
