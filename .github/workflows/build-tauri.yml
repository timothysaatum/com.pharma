name: Build and Release Tauri App

on:
  push:
    tags:
      - 'v*'   # Triggers when you push a version tag e.g. v1.0.0
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.atlas.drive4health.org' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'  # Apple Silicon
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'   # Intel Mac

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update -m || sudo apt-get update || true
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        timeout-minutes: 10

      - name: Install frontend dependencies
        working-directory: ui.laso
        run: pnpm install --frozen-lockfile

      - name: Validate production API URL
        run: node -e "if (!process.env.VITE_API_URL?.startsWith('https://')) throw new Error('VITE_API_URL must be an HTTPS URL')"

      - name: Test frontend
        working-directory: ui.laso
        run: pnpm test

      - name: Audit frontend dependencies
        working-directory: ui.laso
        run: pnpm audit --prod

      - name: Test Rust commands
        working-directory: ui.laso/src-tauri
        run: cargo test --locked

      - name: Audit Rust dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ui.laso/src-tauri/Cargo.toml
          command: check
          command-arguments: advisories

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: ui.laso
          tagName: ${{ github.ref_name }}
          releaseName: 'Laso v__VERSION__'
          releaseBody: 'Download the installer for your platform below.'
          releaseDraft: true   # Creates a draft release — you review before publishing
          prerelease: false
          args: ${{ matrix.args }}
